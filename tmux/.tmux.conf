# Ghostty: proper TERM inside tmux + true color + extended keys
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys"

# Pass modified keys (e.g. Shift+Enter in Claude Code) through to apps
set -s extended-keys on

# New panes/windows open in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"
