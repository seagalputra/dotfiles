# Ghostty: proper TERM inside tmux + true color + extended keys
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys"

# Pass modified keys (e.g. Shift+Enter in Claude Code) through to apps
set -s extended-keys on

# Colors: use the terminal's own palette (no hex), so tmux always matches
# the Ghostty theme. bg=default = same background as the terminal.
set -g status-style                 "bg=default,fg=brightblack"
set -g status-left-style            "fg=blue,bold"
set -g status-right-style           "fg=brightblack"
set -g window-status-style          "fg=brightblack"
set -g window-status-current-style  "fg=blue,bold"
set -g pane-border-style            "fg=brightblack"
set -g pane-active-border-style     "fg=blue"
# fill= clears the status line behind the prompt (else the ─ row shows through)
set -g message-style                "bg=yellow,fg=black,fill=yellow"
set -g message-command-style        "bg=yellow,fg=black,fill=yellow"
set -g mode-style                   "bg=blue,fg=black"
set -g clock-mode-colour            blue

# Session name + gap before the window list (default length 10 cut off the gap)
set -g status-left        "[#{session_name}] "
set -g status-left-length 40

# 2-row status: row 1 is a full-width ─── separator (sits mid-cell, giving
# ~half a row of space above and below), row 2 is the default status line.
# Prompt/messages are drawn on row 2 so the separator stays intact.
set -gu status-format
set -gF status-format[1] "#{status-format[0]}"
set -g  status-format[0] "#[fg=brightblack]#{R:─,#{client_width}}"
set -g  status 2
set -g  message-line 1

# Terminal (Ghostty) window title: "[window-name] ~/current/path"
# ($HOME is expanded by tmux when the config is read)
set -g set-titles on
set -g set-titles-string "[#W] #{s|^$HOME|~|:pane_current_path}"
set -g status-interval 5   # refresh title/status every 5s (picks up `cd` sooner)

set -g detach-on-destroy off

# New panes/windows open in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"
