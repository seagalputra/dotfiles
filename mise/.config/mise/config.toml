# Global tool versions (replaces nvm, pyenv, rbenv, SDKMAN, asdf).
# Per-project versions: `mise use <tool>@<version>` in the project dir.
[tools]
node = "24.18.0"
python = "3.14.7"
ruby = "4.0.6"
java = "corretto-24"
erlang = "29.0.1"
elixir = "1.20.2-otp-29"

[settings]
# Honor existing .nvmrc / .node-version / .python-version / .ruby-version / .java-version / .sdkmanrc
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "java"]
