# Global tool versions (replaces nvm, pyenv, rbenv, SDKMAN, asdf, rustup, …).
# Per-project versions: `mise use <tool>@<version>` in the project dir.
[tools]
node = "24.18.0"
python = "3.14.7"
ruby = "4.0.6"
java = "corretto-24"
erlang = "29.0.1"
elixir = "1.20.2-otp-29"
go = "1.27.3"
# Through rustup in ~/.rustup and ~/.cargo; `cargo install` bins stay in ~/.cargo/bin.
# Targets: iOS, Android and wasm builds.
rust = { version = "1.99.1", components = ["rust-src"], targets = [
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
  "wasm32-unknown-unknown",
] }
bun = "1.4.4"
deno = "2.9.8"

[settings]
# Honor existing .nvmrc / .node-version / .python-version / .ruby-version / .java-version / .sdkmanrc
# and rust-toolchain.toml. rust is needed: mise sets RUSTUP_TOOLCHAIN, which otherwise beats the project's file.
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "java", "rust"]
# `go install` puts bins in ~/go/bin (on PATH in ~/.zshrc), not in the Go version's dir,
# so they survive Go upgrades.
go.set_gobin = false
